services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    container_name: n8n-compose
    ports:
      - "5678:5678"
      - "5679:5679"
    networks:
      - n8n-network
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=false
      - TZ=${GENERIC_TIMEZONE}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - N8N_RUNNERS_ENABLED=true
    depends_on:
      - postgres
      - redis
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/home/node/.n8n-files

  n8n-backup:
    image: alpine
    container_name: n8n-backup
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
    volumes:
      - n8n_data:/source:ro
      - ./backups:/backup
      - ./backup-scripts:/scripts
    command: >
      sh -c "apk add --no-cache tzdata ca-certificates &&
             echo '0 12 * * * /scripts/backup-n8n.sh' > /etc/crontabs/root &&
             crond -f -d 8"

  postgres:
    image: postgres:15
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=n8n
    ports:
      - "5432:5432"
    networks:
      - n8n-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: n8n-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - n8n-network
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC (opzionale)
    container_name: qdrant
    networks:
      - n8n-network
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT_API_KEY=test-local-key

  ollama:
      image: ollama/ollama
      ports:
        - "11434:11434"
      container_name: ollama
      networks:
        - n8n-network
      volumes:
        - ollama_data:/root/.ollama
networks:
  n8n-network:

volumes:
  n8n_data:
    external: true
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
